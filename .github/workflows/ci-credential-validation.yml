name: One-time CI credential validation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'afonsojramos/discrakt'
      && github.event.pull_request.head.repo.full_name == 'afonsojramos/discrakt'
      && github.event.pull_request.head.ref == 'ci/1password-secrets'
      && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load existing release credentials
        id: secrets
        uses: 1password/load-secrets-action@v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_APP_PASSWORD: op://discrakt-prod/APPLE_APP_PASSWORD/password
          APPLE_ID: op://discrakt-prod/APPLE_ID/password
          APPLE_TEAM_ID: op://discrakt-prod/APPLE_TEAM_ID/password
          HOMEBREW_TAP_TOKEN: op://discrakt-prod/HOMEBREW_TAP_TOKEN/password
          MACOS_CERTIFICATE_BASE64: op://discrakt-prod/MACOS_CERTIFICATE_BASE64/password
          MACOS_CERTIFICATE_PASSWORD: op://discrakt-prod/MACOS_CERTIFICATE_PASSWORD/password
          MACOS_KEYCHAIN_PASSWORD: op://discrakt-prod/MACOS_KEYCHAIN_PASSWORD/password
          MACOS_SIGNING_IDENTITY: op://discrakt-prod/MACOS_SIGNING_IDENTITY/password
          WINGET_TOKEN: op://discrakt-prod/WINGET_TOKEN/password

      - name: Verify masked outputs without publishing
        env:
          APPLE_APP_PASSWORD: ${{ steps.secrets.outputs.APPLE_APP_PASSWORD }}
          APPLE_ID: ${{ steps.secrets.outputs.APPLE_ID }}
          APPLE_TEAM_ID: ${{ steps.secrets.outputs.APPLE_TEAM_ID }}
          HOMEBREW_TAP_TOKEN: ${{ steps.secrets.outputs.HOMEBREW_TAP_TOKEN }}
          MACOS_CERTIFICATE_BASE64: ${{ steps.secrets.outputs.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ steps.secrets.outputs.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ steps.secrets.outputs.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ steps.secrets.outputs.MACOS_SIGNING_IDENTITY }}
          WINGET_TOKEN: ${{ steps.secrets.outputs.WINGET_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os
          names = ['APPLE_APP_PASSWORD', 'APPLE_ID', 'APPLE_TEAM_ID', 'HOMEBREW_TAP_TOKEN', 'MACOS_CERTIFICATE_BASE64', 'MACOS_CERTIFICATE_PASSWORD', 'MACOS_KEYCHAIN_PASSWORD', 'MACOS_SIGNING_IDENTITY', 'WINGET_TOKEN']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('A required masked CI output is missing')
          print('All nine release credentials resolved through 1Password')
          PYTHON
