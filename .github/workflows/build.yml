name: Main Workflow

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Set up toolchain via mise (node, nub, rust)
        uses: jdx/mise-action@v5.0.1

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: |
          cargo check
          cargo test

  # Build artifacts for all platforms when 'build-artifacts' label is present
  build-artifacts:
    name: Build Artifacts
    if: contains(github.event.pull_request.labels.*.name, 'build-artifacts')
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: discrakt.exe
            name: windows
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: discrakt
            name: macos-arm64
            architecture: arm64
            minimum-macos: "11.0"
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: discrakt
            name: macos-x86_64
            architecture: x86_64
            minimum-macos: "10.13"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: discrakt
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Set up toolchain via mise (node, nub, rust)
        uses: jdx/mise-action@v5.0.1

      - name: Add compile target
        run: rustup target add ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          DISCRAKT_VERSION: 0.0.0-test
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum-macos }}
        run: cargo build --release --target=${{ matrix.target }}

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY_PATH: target/${{ matrix.target }}/release/discrakt
        run: test "$("$BINARY_PATH" --version)" = "discrakt 0.0.0-test"

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        env:
          BINARY_PATH: target/${{ matrix.target }}/release/discrakt
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(lipo -archs "$BINARY_PATH")" = "$EXPECTED_ARCHITECTURE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: discrakt-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          retention-days: 14
